# ==============================================================================
# NGINX INITIAL BOOTSTRAP CONFIGURATION (HTTP ONLY)
# Domains: myup.uz, www.myup.uz, admin.myup.uz
#
# PURPOSE:
# Use this configuration ONLY during the initial VPS bootstrap before Let's Encrypt
# SSL certificates have been obtained. It allows Certbot to verify domain ownership
# via the /.well-known/acme-challenge/ endpoint.
#
# INSTRUCTIONS:
# 1. sudo cp deploy/nginx/myup-initial-http.conf /etc/nginx/sites-available/myup.conf
# 2. sudo ln -sf /etc/nginx/sites-available/myup.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. Run Certbot to acquire SSL certificates:
#    sudo certbot certonly --webroot -w /var/www/certbot -d myup.uz -d www.myup.uz -d admin.myup.uz
# 5. Replace with production SSL config:
#    sudo cp deploy/nginx/myup.conf /etc/nginx/sites-available/myup.conf
# 6. sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name myup.uz www.myup.uz admin.myup.uz;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Temporary health check / status placeholder
    location / {
        default_type text/plain;
        return 200 "MyUp Server Initializing. Please complete Let's Encrypt SSL issuance.\n";
    }
}
