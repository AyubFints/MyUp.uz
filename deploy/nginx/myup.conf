# ==============================================================================
# NGINX PRODUCTION REVERSE PROXY CONFIGURATION
# Domains:
#   - myup.uz & www.myup.uz (Main User Location & Fuel Finder SPA)
#   - admin.myup.uz         (A-Maps Super Admin Dashboard SPA)
#   - /api/                 (Node.js Express REST API Cluster on port 5000)
#
# Installation Target: /etc/nginx/sites-available/myup.conf
# Enabled Link:        /etc/nginx/sites-enabled/myup.conf
# ==============================================================================

# WebSocket and HTTP/1.1 Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Node.js Backend Cluster (Express API)
upstream myup_api_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS REDIRECTION (Port 80)
# Redirects all insecure HTTP traffic to HTTPS, while exposing the Let's Encrypt
# ACME webroot challenge directory for SSL certificate issuance and renewals.
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name myup.uz www.myup.uz admin.myup.uz;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. MAIN FRONTEND SPA & API (myup.uz & www.myup.uz) (Port 443 HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myup.uz www.myup.uz;

    # SSL Certificate & Private Key (Provisioned via Certbot)
    ssl_certificate /etc/letsencrypt/live/myup.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myup.uz/privkey.pem;

    # Modern TLS Protocols & Ciphers (Mozilla Modern Profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching & Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_MYUP:10m;
    ssl_session_tickets off;

    # OCSP Stapling (Validates certificate revocation with high performance)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum Request Payload Size (Permits station photos, receipt uploads, etc.)
    client_max_body_size 50M;

    # Gzip Dynamic Response Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Static Frontend SPA Root (Vite Production Build)
    root /var/www/myup/dist;
    index index.html;

    # Logging
    access_log /var/log/nginx/myup_access.log;
    error_log  /var/log/nginx/myup_error.log warn;

    # A) Node.js Backend Express API Reverse Proxy
    location /api/ {
        proxy_pass http://myup_api_upstream/api/;
        proxy_http_version 1.1;

        # WebSocket & Keepalive Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cache Bypass for dynamic API queries
        proxy_cache_bypass $http_upgrade;

        # Robust Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
    }

    # B) Static Long-Term Hashed Assets & Maps (1 Year Immutable Cache)
    # Includes styles, scripts, fonts, images, and Protomaps vector tiles (.pmtiles)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico|pmtiles|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # C) Service Worker & Manifest (Never aggressively cache SW)
    location ~* (?:service-worker\.js|manifest\.json|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # D) Static Assets Fallback
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # E) SPA Client-Side Routing Fallback
    # Returns index.html for all non-static paths, ensuring React Router / client routes resolve
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Disable logging for favicon and robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}

# ------------------------------------------------------------------------------
# 3. SUPER ADMIN FRONTEND SPA & API (admin.myup.uz) (Port 443 HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.myup.uz;

    # SSL Certificate & Private Key (Shared multi-domain or dedicated cert)
    ssl_certificate /etc/letsencrypt/live/myup.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myup.uz/privkey.pem;

    # Modern TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_MYUP_ADMIN:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Hardened Security Headers for Admin Portal
    # DENY clickjacking explicitly for privileged admin dashboard
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum Request Payload Size (Permits fuel station media & card logos)
    client_max_body_size 50M;

    # Gzip Dynamic Response Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Static Admin Frontend SPA Root (Vite Production Build)
    root /var/www/myup-admin/dist;
    index index.html;

    # Logging
    access_log /var/log/nginx/myup_admin_access.log;
    error_log  /var/log/nginx/myup_admin_error.log warn;

    # A) Node.js Backend Express API Reverse Proxy for Admin Portal
    location /api/ {
        proxy_pass http://myup_api_upstream/api/;
        proxy_http_version 1.1;

        # WebSocket & Keepalive Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cache Bypass for dynamic API queries
        proxy_cache_bypass $http_upgrade;

        # Robust Timeouts & Buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
        proxy_busy_buffers_size 64k;
    }

    # B) Static Long-Term Hashed Assets (1 Year Immutable Cache)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # C) Assets Directory Fallback
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # D) Admin SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Disable logging for favicon and robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
